name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # llama.cpp lives at service/service-ai/llama.cpp as a submodule;
          # service-ai's native build needs its source.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          # Match what service-ai's CMake expects. The runner image rotates
          # which NDKs are pre-installed; pin one so builds are reproducible.
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        # If the secret isn't configured (e.g. someone forks the repo) we
        # silently skip — app/build.gradle.kts falls back to the debug
        # keystore in that case.
        env:
          KEYSTORE_B64: ${{ secrets.ARCANA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/arcana-release.jks"
            echo "Decoded keystore to $RUNNER_TEMP/arcana-release.jks ($(stat -c%s "$RUNNER_TEMP/arcana-release.jks") bytes)"
          else
            echo "No release keystore secret set — falling back to debug signing."
          fi

      - name: Build release APK
        env:
          # Picked up by signingConfigs.releaseFromEnv in app/build.gradle.kts.
          # Empty when no keystore was decoded; gradle then falls back to debug.
          ARCANA_KEYSTORE_PATH: ${{ runner.temp }}/arcana-release.jks
          ARCANA_KEYSTORE_PASSWORD: ${{ secrets.ARCANA_KEYSTORE_PASSWORD }}
          ARCANA_KEY_ALIAS: ${{ secrets.ARCANA_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK with version-tagged name
        run: cp app/build/outputs/apk/release/app-release.apk "Arcana-${{ github.ref_name }}.apk"

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          ASSET="Arcana-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "$ASSET"
          fi
